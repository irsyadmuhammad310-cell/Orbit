<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1d2e">
<meta name="description" content="Orbit - Goals, Projects & Tasks">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Orbit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" class="splash">
  <div class="splash-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg>
  </div>
  <div class="splash-text">Orbit</div>
  <div class="splash-loader"></div>
</div>

<div class="app" id="app" style="display:none">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg></div>
      <span class="brand-text">Orbit</span>
      <span class="brand-badge">v1</span>
    </div>
    <nav class="nav" id="sideNav">
      <div class="nav-item active" data-p="overview"><i data-lucide="layout-dashboard"></i>Overview</div>
      <div class="nav-item" data-p="tasks"><i data-lucide="check-square"></i>Tasks<span class="nav-badge" id="navTaskBadge"></span></div>
      <div class="nav-item" data-p="habits"><i data-lucide="flame"></i>Habits</div>
      <div class="nav-item" data-p="calendar"><i data-lucide="calendar"></i>Calendar</div>
      <div class="nav-item" data-p="goals"><i data-lucide="target"></i>Goals</div>
      <div class="nav-item" data-p="projects"><i data-lucide="folder-kanban"></i>Projects</div>
      <div class="nav-item" data-p="reminders"><i data-lucide="bell"></i>Reminders<span class="nav-badge warn" id="navRemBadge"></span></div>
      <div class="nav-divider"></div>
      <div class="nav-item" data-p="settings"><i data-lucide="settings"></i>Settings</div>
    </nav>
    <div class="sidebar-footer"></div>
  </aside>

  <!-- Main Content -->
  <main class="main" id="mainContent">
    <div class="page-view active" id="pg-overview"></div>
    <div class="page-view" id="pg-tasks"></div>
    <div class="page-view" id="pg-habits"></div>
    <div class="page-view" id="pg-calendar"></div>
    <div class="page-view" id="pg-goals"></div>
    <div class="page-view" id="pg-projects"></div>
    <div class="page-view" id="pg-reminders"></div>
    <div class="page-view" id="pg-settings"></div>
  </main>
</div>

<!-- Mobile Nav -->
<nav class="mobile-bar" id="mobNav">
  <div class="mob-btn active" data-p="overview"><i data-lucide="home"></i>Home</div>
  <div class="mob-btn" data-p="tasks"><i data-lucide="check-square"></i>Tasks</div>
  <div class="mob-btn" data-p="calendar"><i data-lucide="calendar"></i>Cal</div>
  <div class="mob-btn" data-p="goals"><i data-lucide="target"></i>Goals</div>
  <div class="mob-btn" data-p="reminders"><i data-lucide="bell"></i>Alerts</div>
</nav>

<!-- Modal -->
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>

<!-- Toast -->
<div class="toasts" id="toasts"></div>

<!-- Scripts -->
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/helpers.js"></script>
<script src="js/app.js"></script>
<script src="js/overview.js"></script>
<script src="js/tasks.js"></script>
<script src="js/calendar.js"></script>
<script src="js/goals.js"></script>
<script src="js/projects.js"></script>
<script src="js/reminders.js"></script>
<script src="js/habits.js"></script>
<script>
  // Clear stale localStorage that had integrations
  (function() {
    try {
      var s = localStorage.getItem('orbit_data');
      if (s && s.indexOf('integrations') !== -1) localStorage.removeItem('orbit_data');
    } catch(e) { localStorage.removeItem('orbit_data'); }
  })();

  // Boot
  setTimeout(() => {
    document.getElementById('splash').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('splash').style.display = 'none';
      document.getElementById('app').style.display = 'grid';
      Orbit.init();
    }, 300);
  }, 1200);
</script>
</body>
</html>
