<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app" id="app">
  <!-- Header -->
  <header class="header">
    <div class="header-brand">Orbit</div>
    <div class="header-greeting">Good evening, <strong id="userName">Irsyad</strong></div>
    <div class="header-right">
      <button class="btn btn--primary" id="quickAddBtn">+ Quick Add</button>
      <div class="header-avatar" id="userAvatar">MI</div>
    </div>
  </header>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="nav-group-label">Menu</div>
    <div class="nav-item active" data-page="overview"><span class="nav-icon">🏠</span> Overview</div>
    <div class="nav-item" data-page="tasks"><span class="nav-icon">✅</span> Tasks<span class="nav-count" id="taskCount">0</span></div>
    <div class="nav-item" data-page="goals"><span class="nav-icon">🎯</span> Goals<span class="nav-count" id="goalCount">0</span></div>
    <div class="nav-item" data-page="projects"><span class="nav-icon">🚀</span> Projects<span class="nav-count" id="projectCount">0</span></div>
    <div class="nav-item" data-page="notes"><span class="nav-icon">📝</span> Notes<span class="nav-count" id="noteCount">0</span></div>
    <div class="nav-item" data-page="calendar"><span class="nav-icon">📅</span> Calendar</div>
    <div class="nav-group-label">System</div>
    <div class="nav-item" data-page="settings"><span class="nav-icon">⚙️</span> Settings</div>
    <div class="sidebar-footer">
      <div class="progress-mini"><span>Weekly Progress</span><span id="weeklyPct">0%</span></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="weeklyBar"></div></div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main" id="mainContent">
    <div class="page-view active" id="page-overview"></div>
    <div class="page-view" id="page-tasks"></div>
    <div class="page-view" id="page-goals"></div>
    <div class="page-view" id="page-projects"></div>
    <div class="page-view" id="page-notes"></div>
    <div class="page-view" id="page-calendar"></div>
    <div class="page-view" id="page-settings"></div>
  </main>
</div>

<!-- Modals -->
<div class="modal-overlay" id="noteModal"></div>
<div class="modal-overlay" id="addNoteModal"></div>
<div class="modal-overlay" id="quickAddModal"></div>

<!-- Undo Toast -->
<div class="undo-toast" id="undoToast">
  <span class="undo-toast-msg" id="undoToastMsg"></span>
  <button class="undo-toast-btn" onclick="Undo.execute()">Undo</button>
  <button class="undo-toast-close" onclick="Undo.hideToast()">✕</button>
</div>

<!-- Scripts (order matters!) -->
<script src="js/data.js"></script>
<script src="js/seed.js"></script>
<script src="js/undo.js"></script>
<script src="js/search.js"></script>
<script src="js/overview.js"></script>
<script src="js/tasks.js"></script>
<script src="js/goals.js"></script>
<script src="js/projects.js"></script>
<script src="js/notes.js"></script>
<script src="js/calendar.js"></script>
<script src="js/settings.js"></script>
<script src="js/review.js"></script>
<script src="js/focus.js"></script>
<script src="js/habits.js"></script>
<script src="js/insights.js"></script>
<script src="js/app.js"></script>
</body>
</html>
