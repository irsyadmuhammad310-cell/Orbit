<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6366f1">
<title>Orbit</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

<!-- Pages -->
<div class="page active" id="pg-home"></div>
<div class="page" id="pg-tasks"></div>
<div class="page" id="pg-calendar"></div>
<div class="page" id="pg-projects"></div>
<div class="page" id="pg-more"></div>
<div class="page" id="pg-goals"></div>
<div class="page" id="pg-habits"></div>
<div class="page" id="pg-notes"></div>
<div class="page" id="pg-settings"></div>
<div class="page" id="pg-search"></div>
<div class="page" id="pg-ai"></div>
<div class="page" id="pg-docs"></div>
<div class="page" id="pg-analytics"></div>
<div class="page" id="pg-focus"></div>
<div class="page" id="pg-reminders"></div>
<div class="page" id="pg-contacts"></div>
<div class="page" id="pg-expenses"></div>

<!-- Bottom Nav -->
<nav class="nav">
  <button class="nav-b on" onclick="App.go('home')"><span>🏠</span><span>Home</span></button>
  <button class="nav-b" onclick="App.go('tasks')"><span>✓</span><span>Tasks</span></button>
  <button class="nav-b" onclick="App.go('calendar')"><span>📅</span><span>Calendar</span></button>
  <button class="nav-b" onclick="App.go('projects')"><span>🚀</span><span>Projects</span></button>
  <button class="nav-b" onclick="App.go('more')"><span>⋯</span><span>More</span></button>
</nav>

<!-- Bottom Sheet -->
<div class="sheet-bg" id="sheetBg" onclick="if(event.target===this)closeSheet()">
  <div class="sheet"><div class="sheet-h"></div><div id="sheetContent"></div></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Scripts (order matters! data.js first, app.js last) -->
<script src="js/data.js"></script>
<script src="js/seed.js"></script>
<script src="js/home.js"></script>
<script src="js/tasks.js"></script>
<script src="js/calendar.js"></script>
<script src="js/projects.js"></script>
<script src="js/tracker.js"></script>
<script src="js/notes.js"></script>
<script src="js/admin.js"></script>
<script src="js/intelligence.js"></script>
<script src="js/contacts.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
<script>
// Register Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(function(reg) {
    console.log('Orbit SW registered:', reg.scope);
  }).catch(function(e) { console.warn('SW registration failed:', e); });
}
</script>
</body>
</html>
